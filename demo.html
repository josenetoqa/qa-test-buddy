<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Buddy · Demo</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/styles.css"><main class="layout" style="max-width:520px"><p class="eyebrow">LOCAL DEMO</p><h1>Contact form</h1><p class="subtitle">A safe local page for real Playwright runs.</p><form class="panel" id="demo-form" novalidate><label for="email">Email address</label><input id="email" type="email" style="width:100%;padding:12px;margin-bottom:20px"><button class="primary-button">Create contact</button><p id="message" role="status"></p></form></main><script>document.getElementById('demo-form').addEventListener('submit',event=>{event.preventDefault();const email=document.getElementById('email').value;document.getElementById('message').textContent=!email?'Enter an email address':/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)?'Contact created':'Enter a valid email address';});</script></html>
